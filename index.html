window.abrirHistoricoLancamentos = function(limite=10, hFiltroStatus='todos', hFiltroCat='todos', hFiltroPeriodo='todos') {
  const overlay = document.getElementById('modal-overlay');
  const mc = document.getElementById('modal-content');

  // Apply filters
  let gastosFiltrados = [...gastos];
  if(hFiltroStatus !== 'todos') gastosFiltrados = gastosFiltrados.filter(g=>g.status===hFiltroStatus);
  if(hFiltroCat !== 'todos') gastosFiltrados = gastosFiltrados.filter(g=>g.categoria===hFiltroCat);
  if(hFiltroPeriodo !== 'todos') {
    const [ano, mes] = hFiltroPeriodo.split('-').map(Number);
    gastosFiltrados = gastosFiltrados.filter(g=>{
      const d = new Date(g.data+'T00:00:00');
      return d.getFullYear()===ano && d.getMonth()===(mes-1);
    });
  }

  // Group by date
  const porData = {};
  gastosFiltrados.forEach(g=>{
    if(!g.data) return;
    if(!porData[g.data]) porData[g.data] = [];
    porData[g.data].push(g);
  });

  const datas = Object.keys(porData).sort((a,b)=>new Date(b)-new Date(a));
  const visiveis = datas.slice(0, limite);
  const temMais = datas.length > limite;

  // Calc days since last entry (always from all gastos)
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const todasDatas = Object.keys({}).constructor.fromEntries
    ? Object.keys(gastos.reduce((acc,g)=>{if(g.data)acc[g.data]=1;return acc;},{})).sort((a,b)=>new Date(b)-new Date(a))
    : [];
  const ultimaDataGeral = gastos.length>0 ? gastos.map(g=>g.data).filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0] : null;
  const diasSem = ultimaDataGeral ? Math.floor((hoje-new Date(ultimaDataGeral+'T00:00:00'))/(1000*60*60*24)) : null;

  // Build period options
  const periodos = {};
  gastos.forEach(g=>{
    if(!g.data) return;
    const d = new Date(g.data+'T00:00:00');
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    periodos[key] = MESES[d.getMonth()]+' '+d.getFullYear();
  });
  const periodoOpts = Object.entries(periodos).sort((a,b)=>b[0].localeCompare(a[0]))
    .map(([val,label])=>'<option value="'+val+'" '+(hFiltroPeriodo===val?'selected':'')+'>'+label+'</option>').join('');

  const temFiltro = hFiltroStatus!=='todos'||hFiltroCat!=='todos'||hFiltroPeriodo!=='todos';

  const linhas = visiveis.length===0
    ? '<div class="empty"><div class="empty-icon">🔍</div><p>Nenhum lançamento encontrado</p></div>'
    : visiveis.map(data=>{
        const gastosDia = porData[data];
        const totalDia = gastosDia.reduce((s,g)=>s+(g.valor||0),0);
        const dataFmt = new Date(data+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
        const itens = gastosDia.map(g=>{
          const cat = getCat(g.categoria);
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)">'
            +'<div style="font-size:12px">'+cat.icon+' '+(g.descricao||cat.label)+'</div>'
            +'<div style="font-size:12px;font-weight:500;color:'+(g.status==='pago'?'var(--green-mid)':'var(--amber)')+'">'+fmtR(g.valor)+'</div>'
            +'</div>';
        }).join('');
        return '<div style="margin-bottom:12px">'
          +'<div style="font-size:11px;font-weight:600;color:var(--green);text-transform:capitalize;padding:6px 0;border-bottom:2px solid var(--green-light);margin-bottom:6px;display:flex;justify-content:space-between">'
            +'<span>'+dataFmt+'</span><span style="color:var(--red)">'+fmtR(totalDia)+'</span>'
          +'</div>'
          +itens
          +'<div style="font-size:11px;color:var(--text-hint);text-align:right;margin-top:4px">'+gastosDia.length+' lançamento'+(gastosDia.length!==1?'s':'')+'</div>'
        +'</div>';
      }).join('');

  mc.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">Histórico de lançamentos</div>
    <div class="card" style="margin-bottom:12px;padding:12px 16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:13px;color:var(--text-muted)">Último lançamento</span>
        <span style="font-size:13px;font-weight:500;color:${diasSem>=3?'var(--amber)':'var(--green-mid)'}">
          ${diasSem===null?'—':diasSem===0?'Hoje':'há '+diasSem+' dia'+(diasSem!==1?'s':'')}
        </span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px">Período</div>
        <select class="form-input" id="h-filtro-periodo" style="padding:8px 10px;font-size:13px">
          <option value="todos" ${hFiltroPeriodo==='todos'?'selected':''}>Todos</option>
          ${periodoOpts}
        </select>
      </div>
      <div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px">Status</div>
        <select class="form-input" id="h-filtro-status" style="padding:8px 10px;font-size:13px">
          <option value="todos" ${hFiltroStatus==='todos'?'selected':''}>Todos</option>
          <option value="pago" ${hFiltroStatus==='pago'?'selected':''}>✅ Pagos</option>
          <option value="pendente" ${hFiltroStatus==='pendente'?'selected':''}>⏳ Pendentes</option>
        </select>
      </div>
    </div>
    <button onclick="aplicarFiltroHistorico()" style="width:100%;background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px">🔍 Pesquisar</button>
    <div class="filtros" style="margin-bottom:8px">
      <button class="filtro-btn ${hFiltroCat==='todos'?'active':''}" onclick="aplicarFiltroHistorico()">Todas</button>
      ${CATEGORIAS.map(c=>{const ativo=hFiltroCat===c.id?'active':'';return '<button class="filtro-btn '+ativo+'" onclick="aplicarFiltroHistorico(\''+c.id+'\')">'+c.icon+' '+c.label+'</button>';}).join('')}
    </div>
    ${(()=>{if(!temFiltro)return '';return '<div style="display:flex;justify-content:space-between;align-items:center;background:var(--green-light);border-radius:8px;padding:8px 12px;margin-bottom:8px"><div style="font-size:12px;color:var(--green-mid)">'+datas.length+' dia'+(datas.length!==1?'s':'')+' encontrado'+(datas.length!==1?'s':'')+' · '+gastosFiltrados.length+' lancamento'+(gastosFiltrados.length!==1?'s':'')+'</div><button onclick="abrirHistoricoLancamentos()" style="font-size:11px;color:var(--green);background:none;border:none;cursor:pointer;font-weight:500">x Limpar</button></div>';})()}
    <div class="modal-scroll-list" id="historico-lista">
      ${linhas}
      ${temMais?'<button class="btn-fechar" style="width:100%;padding:10px;border:1px dashed var(--border);border-radius:8px;margin:8px 0" onclick="aplicarFiltroHistorico(undefined,'+(limite+10)+')">↓ Carregar mais 10 registros ('+(datas.length-limite)+' restantes)</button>':''}
    </div>
    <div class="modal-footer"><button class="btn-fechar" onclick="fecharModal()">✕ Fechar</button></div>
  `;
  overlay.classList.add('open');

  window.aplicarFiltroHistorico = function(cat, novoLimite) {
    const periodo = document.getElementById('h-filtro-periodo')?.value || hFiltroPeriodo;
    const status = document.getElementById('h-filtro-status')?.value || hFiltroStatus;
    const categoria = cat !== undefined ? cat : (document.querySelector('.filtros .filtro-btn.active')?.textContent?.trim() !== 'Todas' ? hFiltroCat : 'todos');
    const catFinal = cat !== undefined ? cat : hFiltroCat;
    abrirHistoricoLancamentos(novoLimite||10, status, catFinal, periodo);
  };
};

window.editarTarefa = function(id, etapaNum) {
  const t = tarefas.find(x=>x.id===id);
  if(!t) return;
  const overlay = document.getElementById('modal-overlay');
  const mc = document.getElementById('modal-content');
  mc.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">Editar tarefa</div>
    <div class="form-group">
      <label class="form-label">Nome da tarefa</label>
      <input class="form-input" id="edit-nome" type="text" value="${t.nome||''}">
    </div>
    <div class="form-group">
      <label class="form-label">Data de início</label>
      <input class="form-input" id="edit-inicio" type="date" value="${t.dataInicio||''}">
    </div>
    <div class="form-group">
      <label class="form-label">Observação (opcional)</label>
      <input class="form-input" id="edit-obs" type="text" value="${t.obs||''}">
    </div>
    <button class="btn-primary" id="btn-salvar-edit">Salvar alterações</button>
    <button class="btn-secondary" onclick="fecharModal();setTimeout(()=>abrirTarefasEtapa(${etapaNum}),200)">Cancelar</button>
  `;
  overlay.classList.add('open');
  document.getElementById('btn-salvar-edit').onclick = async () => {
    const nome = document.getElementById('edit-nome').value.trim();
    const inicio = document.getElementById('edit-inicio').value;
    const obs = document.getElementById('edit-obs').value.trim();
    if(!nome) { showToast('Digite o nome da tarefa'); return; }
    if(!inicio) { showToast('Informe a data de início'); return; }
    try {
      await updateDoc(doc(db,'tarefas',id), {nome, dataInicio:inicio, obs});
      showToast('Tarefa atualizada!');
      fecharModal();
      setTimeout(()=>abrirTarefasEtapa(etapaNum), 200);
    } catch(e) { showToast('Erro ao salvar.'); console.error(e); }
  };
};

window.gerarPDFEtapaTarefas = function(num) {
  const et = etapas.find(e=>e.numero===num);
  const tsDaEtapa = tarefas.filter(t=>t.etapa===num).sort((a,b)=>new Date(a.dataInicio||a.criadoEm)-new Date(b.dataInicio||b.criadoEm));
  const prog = calcProgressoEtapa(num);
  const rows = tsDaEtapa.map((t,i)=>{
    const inicio = t.dataInicio ? new Date(t.dataInicio+'T00:00:00').toLocaleDateString('pt-BR') : '—';
    const fim = t.concluidaEm ? new Date(t.concluidaEm+'T00:00:00').toLocaleDateString('pt-BR') : '—';
    const status = t.concluida ? '<span style="background:#e8f5f0;color:#2d6b55;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">✅ Concluída</span>' : '<span style="background:#fdf3e3;color:#c17f24;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">Pendente</span>';
    return '<tr>'
      +'<td>'+(i+1)+'</td>'
      +'<td><strong>'+t.nome+'</strong>'+(t.obs?'<br><small style="color:#888">'+t.obs+'</small>':'')+'</td>'
      +'<td>'+inicio+'</td>'
      +'<td>'+fim+'</td>'
      +'<td>'+status+'</td>'
    +'</tr>';
  }).join('');

  const body = '<div class="rg">'
    +'<div class="rc"><div class="rl">Total de tarefas</div><div class="rv">'+tsDaEtapa.length+'</div></div>'
    +'<div class="rc green"><div class="rl">Concluídas</div><div class="rv">'+prog.concluidas+'</div></div>'
    +'<div class="rc amber"><div class="rl">Pendentes</div><div class="rv">'+(prog.total-prog.concluidas)+'</div></div>'
    +'<div class="rc green"><div class="rl">Progresso</div><div class="rv">'+prog.pct+'%</div></div>'
    +'</div>'
    +'<div style="height:10px;background:#e0ddd6;border-radius:5px;overflow:hidden;margin-bottom:20px">'
      +'<div style="height:100%;width:'+prog.pct+'%;background:#4caf87;border-radius:5px"></div>'
    +'</div>'
    +(et&&et.liberado?'<p style="font-size:12px;color:#2d6b55;margin-bottom:16px">✅ Etapa liberada pela Caixa em '+(et.data?new Date(et.data+'T00:00:00').toLocaleDateString('pt-BR'):'—')+'</p>':'')
    +'<h2>Tarefas</h2>'
    +(tsDaEtapa.length===0
      ? '<p style="color:#999;padding:12px 0">Nenhuma tarefa cadastrada.</p>'
      : '<table><thead><tr><th>#</th><th>Tarefa</th><th>Data de início</th><th>Data de conclusão</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>');

  gerarPDF('Etapa '+num+' — Tarefas', body);
};

window.gerarPDFProgressoObra = function() {
  const pg = calcProgressoGeral();
  const etapasLib = etapas.filter(e=>e.liberado).length;

  const rows = Array.from({length:12}, (_,i)=>{
    const num = i+1;
    const prog = calcProgressoEtapa(num);
    const et = etapas.find(e=>e.numero===num);
    const liberada = et && et.liberado;
    const tsDaEtapa = tarefas.filter(t=>t.etapa===num).sort((a,b)=>new Date(a.dataInicio||a.criadoEm)-new Date(b.dataInicio||b.criadoEm));

    const tarefasRows = tsDaEtapa.length===0
      ? '<tr><td colspan="4" style="color:#999;font-style:italic">Nenhuma tarefa cadastrada</td></tr>'
      : tsDaEtapa.map(t=>{
          const inicio = t.dataInicio ? new Date(t.dataInicio+'T00:00:00').toLocaleDateString('pt-BR') : '—';
          const fim = t.concluidaEm ? new Date(t.concluidaEm+'T00:00:00').toLocaleDateString('pt-BR') : '—';
          const status = t.concluida
            ? '<span style="background:#e8f5f0;color:#2d6b55;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600">✅ Concluída</span>'
            : '<span style="background:#fdf3e3;color:#c17f24;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600">Pendente</span>';
          return '<tr><td>'+t.nome+(t.obs?'<br><small style="color:#888">'+t.obs+'</small>':'')+'</td><td>'+inicio+'</td><td>'+fim+'</td><td>'+status+'</td></tr>';
        }).join('');

    return '<div style="margin-bottom:24px;page-break-inside:avoid">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;background:#f7f5f0;border-radius:8px;padding:10px 14px;margin-bottom:8px;border-left:3px solid '+(prog.pct===100?'#4caf87':'#1a4a3a')+'">'
        +'<div>'
          +'<strong style="font-size:13px">Etapa '+num+'</strong>'
          +(liberada?'<span style="margin-left:8px;background:#e8f5f0;color:#2d6b55;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600">Liberada</span>':'')
        +'</div>'
        +'<div style="text-align:right">'
          +'<strong style="color:'+(prog.pct===100?'#2d6b55':'#1a4a3a')+'">'+prog.pct+'%</strong>'
          +'<div style="font-size:10px;color:#888">'+prog.concluidas+'/'+prog.total+' tarefas</div>'
        +'</div>'
      +'</div>'
      +'<div style="height:6px;background:#e0ddd6;border-radius:3px;overflow:hidden;margin-bottom:10px">'
        +'<div style="height:100%;width:'+prog.pct+'%;background:#4caf87;border-radius:3px"></div>'
      +'</div>'
      +(tsDaEtapa.length>0
        ? '<table><thead><tr><th>Tarefa</th><th>Data de início</th><th>Data de conclusão</th><th>Status</th></tr></thead><tbody>'+tarefasRows+'</tbody></table>'
        : '<p style="color:#999;font-size:12px;padding:4px 0 8px">Nenhuma tarefa cadastrada nesta etapa.</p>')
    +'</div>';
  }).join('');

  const body = '<div class="rg">'
    +'<div class="rc green"><div class="rl">Progresso geral</div><div class="rv">'+pg.pct+'%</div></div>'
    +'<div class="rc"><div class="rl">Etapas liberadas</div><div class="rv">'+etapasLib+' de 12</div></div>'
    +(pg.base==='tarefas'?'<div class="rc green"><div class="rl">Tarefas concluídas</div><div class="rv">'+pg.concluidas+'</div></div><div class="rc"><div class="rl">Total de tarefas</div><div class="rv">'+pg.total+'</div></div>':'')
    +'</div>'
    +'<div style="height:10px;background:#e0ddd6;border-radius:5px;overflow:hidden;margin-bottom:24px">'
      +'<div style="height:100%;width:'+pg.pct+'%;background:#4caf87;border-radius:5px"></div>'
    +'</div>'
    +'<h2>Detalhes por etapa</h2>'
    +rows;

  gerarPDF('Progresso da Obra', body);
};

window.fazerLogout = async function() {
  if(unsubGastos) unsubGastos();
  if(unsubEtapas) unsubEtapas();
  if(unsubDiarias) unsubDiarias();
  if(unsubServentes) unsubServentes();
  if(unsubAportes) unsubAportes();
  if(unsubTarefas) unsubTarefas();
  await signOut(auth);
};

// ===================== BIND =====================
function bindNav() {
  document.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.page==='gastos' && paginaAtual!=='gastos') {
        // Reset to current month when entering gastos tab
        filtroCategoria='todos';
        filtroStatus='todos';
        filtroPeriodo=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
      }
      paginaAtual=btn.dataset.page;
      render();
    });
  });
}
function bindGastos() {
  document.querySelectorAll('.filtro-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{ filtroCategoria=btn.dataset.filtro; render(); });
  });
}

window.aplicarFiltros = function() {
  const periodo = document.getElementById('filtro-periodo')?.value;
  const status = document.getElementById('filtro-status')?.value;
  if(periodo !== undefined) filtroPeriodo = periodo;
  if(status !== undefined) filtroStatus = status;
  render();
};

window.limparFiltros = function() {
  filtroCategoria = 'todos';
  filtroStatus = 'todos';
  filtroPeriodo = 'todos';
  render();
};
function bindEtapas() {}
function bindRelatorios() {
  document.getElementById('btn-mes-prev')?.addEventListener('click',()=>{
    mesRelatorio--; if(mesRelatorio<0){mesRelatorio=11;anoRelatorio--;} render();
  });
  document.getElementById('btn-mes-next')?.addEventListener('click',()=>{
    mesRelatorio++; if(mesRelatorio>11){mesRelatorio=0;anoRelatorio++;} render();
  });
}
function bindConfig() {}

function showToast(msg) {
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function showConfirm({titulo, mensagem, confirmLabel='Confirmar', danger=false, onConfirm}) {
  const overlay = document.getElementById('confirm-overlay');
  document.getElementById('cb-title').textContent = titulo;
  document.getElementById('cb-msg').textContent = mensagem;
  const btnConfirm = document.getElementById('cb-confirm');
  const btnCancel = document.getElementById('cb-cancel');
  btnConfirm.textContent = confirmLabel;
  btnConfirm.className = danger ? 'cb-confirm danger' : 'cb-confirm';
  overlay.classList.add('open');
  const close = () => overlay.classList.remove('open');
  btnConfirm.onclick = () => { close(); onConfirm(); };
  btnCancel.onclick = close;
}

// ===================== INIT =====================
onAuthStateChanged(auth, user=>{
  currentUser = user;
  if(user) { subscribeData(); } else { gastos=[]; etapas=[]; diarias=[]; serventes=[]; aportes=[]; tarefas=[]; render(); }
});
